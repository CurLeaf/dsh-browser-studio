<!doctype html>
<html><head><meta charset="utf-8"><title>popover preview</title>
<style>
  :root {
    --dsw-alias-bg-base: #0f1114; --dsw-alias-bg-layer-1: #15181d; --dsw-alias-bg-layer-2: #1b1f26;
    --dsw-alias-bg-layer-3: #232833; --dsw-alias-border-l1: rgba(255,255,255,.07);
    --dsw-alias-border-l2: rgba(255,255,255,.12); --dsw-alias-label-primary: #e7e9ee;
    --dsw-alias-label-secondary: #a7aeba; --dsw-alias-label-tertiary: #737b89;
    --dsw-alias-brand-primary: #e8a33d;
  }
  html, body { margin: 0; height: 100%; background: #eef1f6; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  .page { position: relative; width: 640px; height: 460px; margin: 0 auto; padding: 36px 44px; background: #fff; overflow: hidden; }
  h1 { font-size: 22px; margin: 0 0 10px; color: #14161a; }
  .lead { color: #5b6474; font-size: 13px; }
  .outline { position: absolute; left: 44px; top: 150px; right: 44px; padding: 10px 12px; border: 2px solid #3b82f6; color: #14161a; font-size: 14px; }
  .card { margin-top: 70px; border: 1px solid #e8ebf2; border-radius: 12px; padding: 16px; color: #14161a; }
  .card b { font-size: 15px; }
  .metric { margin-top: 10px; font-size: 20px; font-weight: 700; }
  .metric span { font-size: 11px; color: #6b7280; font-weight: 400; margin-left: 6px; }
</style></head>
<body><div id="root"></div><script src="/pop-preview.js"></script></body></html>
