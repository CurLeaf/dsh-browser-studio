<!doctype html>
<html data-ds-theme="dark"><head><meta charset="utf-8"><title>studio preview</title>
<style>
  :root {
    color-scheme: dark;
    --dsw-alias-bg-base: #0f1114;
    --dsw-alias-bg-layer-1: #15181d;
    --dsw-alias-bg-layer-2: #1b1f26;
    --dsw-alias-bg-layer-3: #232833;
    --dsw-alias-border-l1: rgba(255,255,255,.07);
    --dsw-alias-border-l2: rgba(255,255,255,.12);
    --dsw-alias-label-primary: #e7e9ee;
    --dsw-alias-label-secondary: #a7aeba;
    --dsw-alias-label-tertiary: #737b89;
    --dsw-alias-brand-primary: #e8a33d;
  }
  html, body { margin: 0; height: 100%; background: #0b0d10; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .preview { width: min(380px, calc(100vw - 40px)); height: 760px; display: flex; flex-direction: column; overflow: hidden;
    background: var(--dsw-alias-bg-base); border: 1px solid var(--dsw-alias-border-l2); border-radius: 10px; }
</style></head>
<body><div id="root"></div><script src="/preview.js"></script></body></html>
