<!doctype html>
<html><head><meta charset="utf-8"><title>Demo store</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f7fb; color: #14161a; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; background: #fff; border-bottom: 1px solid #e8ebf2; }
  .brand { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2f6fed; }
  nav { display: flex; gap: 18px; font-size: 13px; color: #5b6474; }
  main { padding: 22px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.lead { margin: 0 0 20px; color: #5b6474; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e8ebf2; border-radius: 12px; padding: 14px; }
  .thumb { height: 84px; border-radius: 8px; background: linear-gradient(135deg, #dfe7ff, #f4f0ff); margin-bottom: 10px; }
  .card b { display: block; font-size: 13px; }
  .card span { font-size: 12px; color: #6b7280; }
  .cta { margin-top: 18px; display: inline-flex; gap: 8px; align-items: center; background: #2f6fed; color: #fff; border: 0; border-radius: 9px; padding: 10px 16px; font-size: 13px; font-weight: 600; }
</style></head>
<body>
<header><div class="brand"><span class="dot"></span> Northwind</div><nav><span>首页</span><span>商品</span><span>订单</span></nav></header>
<main>
  <h1>今日精选</h1>
  <p class="lead">为你的工作台挑一件顺手的东西。</p>
  <div class="grid">
    <div class="card"><div class="thumb"></div><b>机械键盘</b><span>¥ 699</span></div>
    <div class="card"><div class="thumb"></div><b>4K 显示器</b><span>¥ 2,199</span></div>
    <div class="card"><div class="thumb"></div><b>人体工学椅</b><span>¥ 1,599</span></div>
    <div class="card"><div class="thumb"></div><b>桌面灯</b><span>¥ 329</span></div>
  </div>
  <button class="cta">加入购物车</button>
</main>
</body></html>
