<!doctype html>
<html><head><meta charset="utf-8"><title>host</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  #wrap { position: absolute; left: 100px; top: 100px; width: 200px; height: 150px;
          transform: scale(0.5); transform-origin: top left; }
  webview { width: 400px; height: 300px; border: 2px solid #22c55e; }
</style></head>
<body><div id="wrap"><webview id="guest" src="guest.html"></webview></div>
<script>
  window.__hostState = () => {
    const view = document.getElementById('guest')
    const rect = view.getBoundingClientRect()
    return { rect: { x: rect.x, y: rect.y, w: rect.width, h: rect.height }, url: view.getURL ? view.getURL() : null }
  }
</script>
</body></html>
